<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gately.uk</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/@ruffle-rs/ruffle@0.1.0-nightly.2025.2.12/ruffle.js"></script> <!-- Ruffle script -->
</head>
<body>
    <header>
        <h1>gately.uk</h1>
    </header>

    <main>
                    <h2>games</h2>
        <section id="hero">
            <!-- This div will contain the Ruffle player -->
            <div id="ruffle-container" style="width:800px; height:600px;"></div>
            <script type="text/javascript">
                window.onload = function() {
                    // Check if Ruffle is loaded
                    if (window.RufflePlayer) {
                        var ruffle = window.RufflePlayer.newest();
                        var container = document.getElementById('ruffle-container');
                        var player = ruffle.createPlayer();
                        container.appendChild(player);
                        player.load('papaspizzeria/papaspizzeria_v2.swf'); // Path to your SWF file
                    } else {
                        alert("Ruffle Player failed to load.");
                    }
                }
            </script>
        </section>

        <section id="gallery">
            <h2>Gallery</h2>
            <div class="image-grid">
                <img src="beesechurger.jpg" alt="Beesechurger 1">
                <img src="beesechurger.jpg" alt="Beesechurger 2">
            </div>
        </section>
    </main>

    <footer>
        <b><p>[FMG]</p>
        <p>2025</p></b>
    </footer>
</body>
</html>
